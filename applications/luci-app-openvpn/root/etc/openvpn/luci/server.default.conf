# Modern OpenVPN Server Configuration Instance

# --- Connection Mode ---
dev tun
proto udp

# --- Network & IP Management ---
port 1194
setenv portextern 1194
server 10.8.0.0 255.255.255.0
server-ipv6 fd00:db8:0:1::/64
topology subnet

# --- Tuning & Optimization ---
mssfix 1360
tcp-nodelay

# --- Certificates & Keys ---
ca /etc/openvpn/keys/ca_default.crt
cert /etc/openvpn/keys/server_default.crt
key /etc/openvpn/keys/server_default.key
dh /etc/openvpn/keys/dh_default.pem

# --- Hardening & Security ---
tls-crypt /etc/openvpn/keys/tls-crypt_default.key
tls-groups secp256r1
cipher AES-256-GCM
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305

# --- Client Push Options ---
push "dhcp-option DNS 9.9.9.9"
push "dhcp-option DNS 149.112.112.112"
push "dhcp-option DNS6 2620:fe::fe"
push "dhcp-option DNS6 2620:fe::9"

# --- Verification & Logging ---
status /tmp/run/openvpn.instance1.status 5
status-version 1
mute-replay-warnings
keepalive 10 120
verb 3

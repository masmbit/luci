# Modern OpenVPN Client Configuration Instance
client
dev tun
proto udp

remote 127.0.0.1 1194
resolv-retry infinite
nobind

persist-key
persist-tun

# TLS certificates instead of static secret
ca /etc/openvpn/keys/ca_default.crt
cert /etc/openvpn/keys/server_default.crt
key /etc/openvpn/keys/server_default.key

# Additional protection against DoS and port scanning
tls-crypt /etc/openvpn/keys/tls-crypt_default.key

# Modern authenticated encryption
tls-groups secp256r1
cipher AES-256-GCM
data-ciphers AES-256-GCM:AES-128-GCM

# For local loop test with identical keys, 'remote-cert-tls server' must be disabled.
# Remove the '#' below when connecting to a real external server with proper X509 keys.
#remote-cert-tls server
verb 3

